name: governed-workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test backend/src/governance/tests/*.test.js
      - run: node --check backend/src/server.js && node --check backend/src/governance/router.js && node --check backend/src/governance/domain.js
      - run: bash -n start.sh
